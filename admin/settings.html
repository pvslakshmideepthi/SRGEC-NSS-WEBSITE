<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings | SRGEC NSS Admin</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar"><a class="brand" href="../index.html"><span class="logo">NSS</span><span><strong>SRGEC NSS</strong><span>Admin Panel</span></span></a><nav class="admin-nav" data-admin-nav><a href="dashboard.html">Dashboard</a><a href="activities.html">Activities</a><a href="camps.html">Camps</a><a href="members.html">Members</a><a href="gallery.html">Gallery</a><a href="settings.html">Settings</a></nav></aside>
    <main class="admin-main">
      <div class="admin-top"><div><span class="eyebrow">Notifications</span><h1>Settings and Announcements</h1></div><button class="btn ghost" data-logout>Logout</button></div>
      <form class="card card-body admin-form" data-settings>
        <label>Publish announcements<textarea class="input" name="announcements"></textarea></label>
        <label>Upcoming events, one per line: date|title|type|venue<textarea class="input" name="events"></textarea></label>
        <label>SRGEC NSS started in<input class="input" name="established"></label>
        <label>Year of establishment<input class="input" name="year"></label>
        <label>First NSS Programme Officer<input class="input" name="firstOfficer"></label>
        <label>Faculty coordinator<input class="input" name="facultyCoordinator"></label>
        <label>Email<input class="input" name="email"></label>
        <label>Phone<input class="input" name="phone"></label>
        <label>Address<input class="input" name="address"></label>
        <div class="actions"><button class="btn orange">Save Settings</button><button class="btn ghost" type="button" data-reset-demo>Reset Demo Data</button></div>
        <p class="meta" data-save-status></p>
      </form>
    </main>
  </div>
  <script src="../js/admin.js"></script>
</body></html>
