<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login | SRGEC NSS</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body>
  <main class="login-shell">
    <form class="card card-body login-card" data-login>
      <div class="brand"><span class="logo">NSS</span><span><strong>SRGEC NSS Admin</strong><span>Content Management</span></span></div>
      <h1>Admin Login</h1>
      <p class="meta">Demo credentials: admin / nss@srgec</p>
      <input class="input" name="username" placeholder="Username" autocomplete="username" required>
      <input class="input" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <p class="meta" data-login-error></p>
      <button class="btn orange">Login</button>
      <a class="btn ghost" href="../index.html">Back to website</a>
    </form>
  </main>
  <script src="../js/admin.js"></script>
</body>
</html>
